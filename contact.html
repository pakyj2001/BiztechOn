<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | BiztechOn</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --header-h: 80px;
            --bg: #fff;
            --text: #111;
            --sub: #888;
            --line: #e5e5e5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        a { text-decoration: none; color: inherit; }

        /* Header */
        header {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: var(--header-h);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4%;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--line);
            z-index: 1000;
        }

        .logo {
            font-family: 'Montserrat';
            font-weight: 700;
            font-size: 1.25rem;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 35px;
        }

        nav ul li a {
            font-family: 'Montserrat';
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--sub);
        }

        nav ul li a.active {
            color: #000;
            font-weight: 700;
        }

        /* Hero */
        .hero {
            padding: 220px 4% 100px;
        }

        .hero span {
            display: block;
            font-family: 'Montserrat';
            font-size: 0.8rem;
            letter-spacing: 4px;
            color: var(--sub);
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .hero h1 {
            font-family: 'Montserrat';
            font-size: clamp(3rem, 10vw, 6rem);
            font-weight: 700;
            letter-spacing: -3px;
        }

        /* Contact */
        .contact {
            max-width: 720px;
            margin: 0 auto;
            padding: 0 4% 120px;
        }

        .contact p {
            margin-bottom: 40px;
            color: #444;
            font-size: 0.95rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-family: 'Montserrat';
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--sub);
        }

        input, textarea {
            padding: 14px 12px;
            font-size: 0.9rem;
            border: none;
            border-bottom: 1px solid var(--line);
            background: transparent;
            outline: none;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        input:focus, textarea:focus {
            border-bottom-color: #000;
        }

        button {
            margin-top: 20px;
            align-self: flex-start;
            padding: 12px 28px;
            background: #000;
            color: #fff;
            border: none;
            font-family: 'Montserrat';
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
        }

        button:hover { opacity: 0.85; }

        footer {
            padding: 60px 4%;
            text-align: center;
            border-top: 1px solid var(--line);
            font-family: 'Montserrat';
            font-size: 0.7rem;
            color: #ccc;
            letter-spacing: 1px;
        }

        /* Mobile Bottom Nav */
        .mobile-nav { display: none; }

        @media (max-width: 900px) {
            header nav { display: none; }

            .mobile-nav {
                display: flex;
                position: fixed;
                bottom: 0; left: 0;
                width: 100%;
                height: 56px;
                background: rgba(255,255,255,0.98);
                border-top: 1px solid var(--line);
                z-index: 2000;
            }

            .mobile-nav a {
                flex: 1;
                text-align: center;
                line-height: 56px;
                font-family: 'Montserrat';
                font-size: 0.65rem;
                text-transform: uppercase;
                color: #aaa;
            }

            .mobile-nav a.active {
                color: #000;
                font-weight: 700;
            }

            body { padding-bottom: 60px; }
        }
    </style>
</head>

<body>

<header>
    <a href="index.html" class="logo">BiztechOn</a>
    <nav>
        <ul>
            <li><a href="index.html">All</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="video.html">Video</a></li>
            <li><a href="design.html">Design</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
</header>

<section class="hero">
    <span>Get In Touch</span>
    <h1>Contact</h1>
</section>

<main class="contact">
    <p>
        프로젝트 문의, 협업 제안, 기타 궁금한 사항이 있다면  
        아래 폼을 통해 언제든지 연락 주세요.
    </p>

    <!-- ✅ 수신자: pyj4877@biztechon.com -->
    <form action="mailto:pyj4877@biztechon.com" method="post" enctype="text/plain">
        <div class="field">
            <label>Name</label>
            <input type="text" name="Name" required>
        </div>

        <div class="field">
            <label>Email</label>
            <input type="email" name="Email" required>
        </div>

        <div class="field">
            <label>Message</label>
            <textarea name="Message" required></textarea>
        </div>

        <button type="submit">Send Message</button>
    </form>
</main>

<footer>
    &copy; 2026 BiztechOn. ALL RIGHTS RESERVED.
</footer>

<nav class="mobile-nav">
    <a href="index.html">All</a>
    <a href="about.html">About</a>
    <a href="video.html">Video</a>
    <a href="design.html">Design</a>
    <a href="contact.html">Contact</a>
</nav>

<script>
    const current = location.pathname.split('/').pop() || 'index.html';
    document.querySelectorAll('nav a').forEach(link => {
        if (link.getAttribute('href') === current) {
            link.classList.add('active');
        }
    });
</script>

</body>
</html>
