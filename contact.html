<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | BiztechOn</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">

<style>
/* ========== Reset ========== */
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family:'Noto Sans KR', sans-serif;
    background:#fff;
    color:#111;
    line-height:1.6;
}
a { text-decoration:none; color:inherit; }

/* ========== Header ========== */
header {
    position:fixed;
    top:0; left:0;
    width:100%; height:80px;
    padding:0 4%;
    display:flex; justify-content:space-between; align-items:center;
    background:rgba(255,255,255,0.95);
    border-bottom:1px solid #eee;
    z-index:1000;
}
.logo {
    font-family:'Montserrat';
    font-weight:700;
    font-size:1.25rem;
}
nav ul {
    list-style:none;
    display:flex;
    gap:32px;
}
nav ul li a {
    font-family:'Montserrat';
    font-size:.8rem;
    letter-spacing:1px;
    text-transform:uppercase;
    color:#888;
}
nav ul li a.active {
    color:#000;
    font-weight:700;
}

/* ========== Hero ========== */
.hero {
    padding:200px 4% 120px;
}
.hero span {
    display:block;
    font-family:'Montserrat';
    font-size:.8rem;
    letter-spacing:4px;
    color:#888;
    text-transform:uppercase;
}
.hero h1 {
    font-family:'Montserrat';
    font-size:4rem;
    margin-top:16px;
}

/* ========== Contact ========== */
.contact {
    max-width:720px;
    margin:0 auto;
    padding:0 4% 160px;
}
.field { margin-bottom:30px; }
label {
    display:block;
    font-family:'Montserrat';
    font-size:.75rem;
    letter-spacing:1px;
    color:#888;
    margin-bottom:8px;
}
input, textarea {
    width:100%;
    padding:14px 12px;
    border:none;
    border-bottom:1px solid #ddd;
    font-size:.9rem;
    outline:none;
}
textarea { min-height:120px; resize:vertical; }
input:focus, textarea:focus { border-bottom-color:#000; }

button {
    margin-top:20px;
    padding:12px 30px;
    background:#000;
    color:#fff;
    border:none;
    font-family:'Montserrat';
    font-size:.75rem;
    letter-spacing:1px;
    text-transform:uppercase;
    cursor:pointer;
}
button:hover { opacity:.85; }

/* ✅ 완료 메시지 */
#success {
    display:none;
    margin-top:40px;
    font-family:'Montserrat';
    font-size:.85rem;
    letter-spacing:1px;
    color:#333;
}

/* ========== Footer ========== */
footer {
    padding:60px 4%;
    text-align:center;
    border-top:1px solid #eee;
    font-family:'Montserrat';
    font-size:.7rem;
    color:#999;
    letter-spacing:1px;
}

/* ========== Mobile Bottom Nav ========== */
.mobile-nav { display:none; }
@media (max-width:900px) {
    header nav { display:none; }
    .mobile-nav {
        display:flex;
        position:fixed;
        bottom:0; left:0;
        width:100%; height:56px;
        background:#fff;
        border-top:1px solid #eee;
        z-index:1000;
    }
    .mobile-nav a {
        flex:1;
        text-align:center;
        line-height:56px;
        font-family:'Montserrat';
        font-size:.65rem;
        letter-spacing:1px;
        text-transform:uppercase;
        color:#aaa;
    }
    .mobile-nav a.active {
        color:#000;
        font-weight:700;
    }
    body { padding-bottom:60px; }
}
</style>

<script>
async function sendForm(e) {
    e.preventDefault();

    const data = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        message: document.getElementById('message').value
    };

    // ✅ Power Automate HTTP POST URL 입력
    const FLOW_URL = "https://prod-xxxx.logic.azure.com/REPLACE_ME";

    try {
        await fetch(FLOW_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });

        // ✅ 폼 숨기고 완료 메시지 표시
        document.getElementById('form').style.display = 'none';
        document.getElementById('success').style.display = 'block';

    } catch (err) {
        alert("전송에 실패했습니다. 잠시 후 다시 시도해주세요.");
    }
}
</script>
</head>

<body>

<!-- Header -->
<header>
    <a href="index.html" class="logo">BiztechOn</a>
    <nav>
        <ul>
            <li><a href="index.html">All</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="video.html">Video</a></li>
            <li><a href="design.html">Design</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>
</header>

<section class="hero">
    <span>Get In Touch</span>
    <h1>Contact</h1>
</section>

<main class="contact">
    <form id="form" onsubmit="sendForm(event)">
        <div class="field">
            <label>Name</label>
            <input id="name" required>
        </div>

        <div class="field">
            <label>Email</label>
            <input type="email" id="email" required>
        </div>

        <div class="field">
            <label>Message</label>
            <textarea id="message" required></textarea>
        </div>

        <button type="submit">Send Message</button>
    </form>

    <!-- ✅ 전송 완료 메시지 -->
    <div id="success">
        ✅ 메시지가 정상적으로 전송되었습니다.<br>
        빠르게 확인 후 연락드리겠습니다. 감사합니다.
    </div>
</main>

<footer>
    &copy; 2026 BiztechOn. ALL RIGHTS RESERVED.
</footer>

<nav class="mobile-nav">
    <a href="index.html">All</a>
    <a href="about.html">About</a>
    <a href="video.html">Video</a>
    <a href="design.html">Design</a>
    <a href="contact.html" class="active">Contact</a>
</nav>

</body>
</html>
