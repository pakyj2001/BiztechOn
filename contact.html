<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | BiztechOn</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">

<style>
/* ================= Reset ================= */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #fff;
    color: #111;
    line-height: 1.6;
}

a {
    text-decoration: none;
    color: inherit;
}

/* ================= Header ================= */
header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 80px;
    padding: 0 4%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid #eee;
    z-index: 1000;
}

.logo {
    font-family: 'Montserrat';
    font-weight: 700;
    font-size: 1.25rem;
}

nav ul {
    list-style: none;
    display: flex;
    gap: 32px;
}

nav ul li a {
    font-family: 'Montserrat';
    font-size: 0.8rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #888;
}

nav ul li a.active {
    color: #000;
    font-weight: 700;
}

/* ================= Hero ================= */
.hero {
    padding: 200px 4% 120px;
}

.hero span {
    display: block;
    font-family: 'Montserrat';
    font-size: 0.8rem;
    letter-spacing: 4px;
    color: #888;
    text-transform: uppercase;
}

.hero h1 {
    font-family: 'Montserrat';
    font-size: 4rem;
    margin-top: 16px;
}

/* ================= Contact ================= */
.contact {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 4% 120px;
}

.contact p {
    margin-bottom: 40px;
    color: #444;
}

.field {
    margin-bottom: 30px;
}

label {
    display: block;
    font-family: 'Montserrat';
    font-size: 0.75rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #888;
    margin-bottom: 8px;
}

input, textarea {
    width: 100%;
    padding: 14px 12px;
    border: none;
    border-bottom: 1px solid #ddd;
    font-size: 0.9rem;
    font-family: 'Noto Sans KR', sans-serif;
    outline: none;
}

textarea {
    resize: vertical;
    min-height: 120px;
}

input:focus, textarea:focus {
    border-bottom-color: #000;
}

button {
    margin-top: 20px;
    padding: 12px 30px;
    background: #000;
    color: #fff;
    border: none;
    font-family: 'Montserrat';
    font-size: 0.75rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
}

button:hover {
    opacity: 0.85;
}

/* ================= Footer ================= */
footer {
    padding: 60px 4%;
    text-align: center;
    border-top: 1px solid #eee;
    font-family: 'Montserrat';
    font-size: 0.7rem;
    color: #999;
    letter-spacing: 1px;
}

/* ================= Mobile Bottom Nav ================= */
.mobile-nav {
    display: none;
}

@media (max-width: 900px) {
    header nav {
        display: none;
    }

    .mobile-nav {
        display: flex;
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 56px;
        background: #fff;
        border-top: 1px solid #eee;
        z-index: 1000;
    }

    .mobile-nav a {
        flex: 1;
        text-align: center;
        line-height: 56px;
        font-family: 'Montserrat';
        font-size: 0.65rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: #aaa;
    }

    .mobile-nav a.active {
        color: #000;
        font-weight: 700;
    }

    body {
        padding-bottom: 70px;
    }
}
</style>

<script>
function sendMail(event) {
    event.preventDefault();

    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const message = document.getElementById('message').value;

    const mailto =
        "mailto:pyj4877@biztechon.com" +
        "?subject=BiztechOn Contact Message" +
        "&body=" +
        encodeURIComponent(
            "Name: " + name + "\n" +
            "Email: " + email + "\n\n" +
            message
        );

    window.location.href = mailto;
}
</script>
</head>

<body>

<!-- Header -->
<header>
    <a href="index.html" class="logo">BiztechOn</a>
    <nav>
        <ul>
            <li><a href="index.html">All</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="video.html">Video</a></li>
            <li><a href="design.html">Design</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>
</header>

<section class="hero">
    <span>Get In Touch</span>
    <h1>Contact</h1>
</section>

<main class="contact">
    <p>
        프로젝트 문의, 협업 제안, 기타 궁금한 사항이 있다면<br>
        아래 폼을 통해 언제든지 연락 주세요.
    </p>

    <form onsubmit="sendMail(event)">
        <div class="field">
            <label>Name</label>
            <input type="text" id="name" required>
        </div>

        <div class="field">
            <label>Email</label>
            <input type="email" id="email" required>
        </div>

        <div class="field">
            <label>Message</label>
            <textarea id="message" required></textarea>
        </div>

        <button type="submit">Send Message</button>
    </form>
</main>

<footer>
    &copy; 2026 BiztechOn. ALL RIGHTS RESERVED.
</footer>

<nav class="mobile-nav">
    <a href="index.html">All</a>
    <a href="about.html">About</a>
    <a href="video.html">Video</a>
    <a href="design.html">Design</a>
    <a href="contact.html" class="active">Contact</a>
</nav>

</body>
</html>
